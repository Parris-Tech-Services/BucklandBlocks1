name: One-off crap4all audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'lizard>=1.24.0,<2'
      - name: Run crap4all 0.1-compatible audit
        run: |
          curl -fsSL https://raw.githubusercontent.com/joshualparris/ElevenRealms/main/.github/crap4all-runner.txt -o /tmp/crap4all_audit.py
          python /tmp/crap4all_audit.py
